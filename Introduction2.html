<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photobooth</title>
  <link rel="stylesheet" href="Intro2style.css">
</head>
<body>
  <div class="container">
    <img class="IntroOpen" src="./Image/IntroOpen.png">
    <img class="IntroCurtain" src="./Image/Curtain.png">
    <img class="IntroInside" src="./Image/IntroInside.png">
  </div>
  <div id="blackOverlay"></div>
</body>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const curtain = document.querySelector(".IntroCurtain");
    const overlay = document.getElementById("blackOverlay");

    curtain.addEventListener("animationend", function() {
      // Show black overlay
      overlay.style.opacity = "1";

      // After 1 second, redirect
      setTimeout(() => {
        window.location.href = "Access.html";
      }, 1000);
    });
  });
</script>

</html>
